name: Validate Bicep

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: az account show

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Verify Azure CLI
        run: az version

      - name: Build Main Bicep
        run: |
          az bicep build --file main.bicep

      - name: Lint Main Bicep
        run: |
          az bicep lint --file main.bicep

      - name: Resolve foundation and inject demo values
        run: |
          KEYVAULT_NAME='${{ vars.KEYVAULT_NAME }}'
          if [ -z "$KEYVAULT_NAME" ]; then
            echo "::error::Set the KEYVAULT_NAME repository variable."
            exit 1
          fi
          if ! FOUNDATION_RESOURCE_GROUP=$(az keyvault show --name "$KEYVAULT_NAME" --query resourceGroup --output tsv); then
            echo "::error::Key Vault '$KEYVAULT_NAME' was not found in the selected subscription or is not readable by the workflow identity."
            exit 1
          fi

          YOUR_PUBLIC_IP='${{ vars.YOUR_PUBLIC_IP }}'
          YOUR_PUBLIC_IP="${YOUR_PUBLIC_IP%/32}"
          sed -i "s|<AZURE_TENANT_ID>|${{ secrets.AZURE_TENANT_ID }}|g" main.parameters.demo.json
          sed -i "s|<AZURE_SUBSCRIPTION_ID>|${{ secrets.AZURE_SUBSCRIPTION_ID }}|g" main.parameters.demo.json
          sed -i "s|<KEYVAULT_NAME>|$KEYVAULT_NAME|g" main.parameters.demo.json
          sed -i "s|<YOUR_PUBLIC_IP>|$YOUR_PUBLIC_IP|g" main.parameters.demo.json
          tmp_file=$(mktemp)
          jq --arg resourceGroup "$FOUNDATION_RESOURCE_GROUP" \
            '.parameters.foundationResourceGroup.value = $resourceGroup' \
            main.parameters.demo.json > "$tmp_file"
          mv "$tmp_file" main.parameters.demo.json
          echo "Using Key Vault '$KEYVAULT_NAME' in resource group '$FOUNDATION_RESOURCE_GROUP'."
    
      - name: Verify Placeholder Replacement
        run: |
          grep -n "<" main.parameters.demo.json && exit 1 || true

      - name: Validate Deployment
        run: |
          az deployment sub validate \
            --location westeurope \
            --template-file main.bicep \
            --parameters main.parameters.demo.json

      - name: What-If
        run: |
          az deployment sub what-if \
            --location westeurope \
            --template-file main.bicep \
            --parameters main.parameters.demo.json